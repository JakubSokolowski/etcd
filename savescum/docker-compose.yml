name: etcd-watch-15271

services:
  etcd1:
    build:
      context: ..
      dockerfile: savescum/Dockerfile
    command:
      - --name=etcd1
      - --data-dir=/etcd-data/member
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=savescum-etcd-15271
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --heartbeat-interval=40
      - --election-timeout=200
      - --snapshot-count=8
      - --experimental-snapshot-catchup-entries=3
      - --quota-backend-bytes=67108864
      - --logger=zap
      - --log-level=warn
    volumes:
      - etcd1_data:/etcd-data
    ports:
      - "2379:2379"

  etcd2:
    build:
      context: ..
      dockerfile: savescum/Dockerfile
    command:
      - --name=etcd2
      - --data-dir=/etcd-data/member
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=savescum-etcd-15271
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --heartbeat-interval=40
      - --election-timeout=200
      - --snapshot-count=8
      - --experimental-snapshot-catchup-entries=3
      - --quota-backend-bytes=67108864
      - --logger=zap
      - --log-level=warn
    volumes:
      - etcd2_data:/etcd-data

  etcd3:
    build:
      context: ..
      dockerfile: savescum/Dockerfile
    command:
      - --name=etcd3
      - --data-dir=/etcd-data/member
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=savescum-etcd-15271
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --heartbeat-interval=40
      - --election-timeout=200
      - --snapshot-count=8
      - --experimental-snapshot-catchup-entries=3
      - --quota-backend-bytes=67108864
      - --logger=zap
      - --log-level=warn
    volumes:
      - etcd3_data:/etcd-data

  driver:
    build:
      context: ..
      dockerfile: savescum/Dockerfile
    entrypoint: ["/usr/local/bin/savescum-driver"]
    environment:
      ETCD_ENDPOINTS: "http://etcd1:2379,http://etcd2:2379,http://etcd3:2379"
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    labels:
      savescum.role: driver
      savescum.setup_complete: manual
      savescum.faults.target: "false"
      savescum.faults.min_interval_ms: "250"
      savescum.faults.max_interval_ms: "450"
      savescum.faults.power_loss_volume_mib: "64"

volumes:
  etcd1_data: {}
  etcd2_data: {}
  etcd3_data: {}
